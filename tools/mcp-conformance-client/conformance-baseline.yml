# Known failures of PromptKit's MCP client against the official conformance
# suite (@modelcontextprotocol/conformance), at the revision the client claims
# (mcp.ProtocolVersion). Read by `make mcp-conformance`.
#
# The suite fails on any failure NOT listed here, and on any entry listed here
# that now PASSES — so this file cannot quietly go stale. Every entry says why
# it fails and where that is tracked. Removing an entry is how a fix proves
# itself; adding one is a decision a reviewer should see, not a way to get
# green.
#
# The suite is a floor, not a ceiling: at 2025-06-18 it had two core client
# scenarios, and PromptKit passed both while the gaps in #2100 were open.
# Behaviour the suite does not exercise is covered by scenario tests in
# runtime/mcp.

client:
  # MCP authorization (OAuth 2.1 for HTTP transports) is OPTIONAL in the spec
  # (basic/authorization). PromptKit does not run OAuth flows itself: secret
  # storage, browser redirects and token persistence belong to the host. The
  # client delegates them to a host-supplied authorizer (tracked in #2100);
  # until that interface lands, HTTP servers are authenticated with static
  # headers (ServerConfig.Headers) and these scenarios fail.
  - auth/metadata-default
  - auth/metadata-var1
  - auth/metadata-var2
  - auth/metadata-var3
  - auth/basic-cimd
  - auth/scope-from-www-authenticate
  - auth/scope-from-scopes-supported
  - auth/scope-omitted-when-undefined
  - auth/scope-step-up
  - auth/scope-retry-limit
  - auth/token-endpoint-auth-basic
  - auth/token-endpoint-auth-post
  - auth/token-endpoint-auth-none
  - auth/pre-registration
