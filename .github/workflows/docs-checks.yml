name: Docs Checks

# Mechanical checks behind docs/STYLE.md and the docs-review plugin's skill
# (see docs/REVIEW.md), run by the docs-kit tool at the tag in DOCS_KIT and
# configured by docs-kit.toml:
# - the voice check (fails only in directories listed in
#   scripts/docs-voice-enforced.txt, warns elsewhere);
# - cited sources that do not exist (scripts/check-docs-sources.sh): fails;
# - pages whose verified facts this PR may have changed: warn-only, written to
#   the job summary. Uncovered surface is reported weekly by docs-freshness.yml.
# Runs on every PR, because a code change is what makes a page stale.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Bump together with the Makefile, docs-freshness.yml and .claude/settings.json.
env:
  DOCS_KIT: git+https://github.com/AltairaLabs/skills@docs-review/v1.0.1#subdirectory=plugins/docs-review/tool

jobs:
  docs-checks:
    name: Docs Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv (docs-kit)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check docs voice
        run: |
          set +e
          uvx --from "$DOCS_KIT" docs-voice > "$RUNNER_TEMP/voice.txt"
          status=$?
          set -e
          grep '^error ' "$RUNNER_TEMP/voice.txt" || true
          {
            echo "## Docs voice"
            echo
            echo "$(grep -c '^error ' "$RUNNER_TEMP/voice.txt" || true) errors (enforced directories),"
            echo "$(grep -c '^warn ' "$RUNNER_TEMP/voice.txt" || true) warnings. See docs/STYLE.md."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # docs-stale only warns about a cited file that is gone ("missing"); a
      # page citing a moved or deleted file must be repointed in the same PR.
      - name: Check cited sources exist
        run: |
          ./scripts/test-check-docs-sources.sh
          ./scripts/check-docs-sources.sh

      - name: Report stale pages
        if: github.event_name == 'pull_request'
        run: |
          stale=$(uvx --from "$DOCS_KIT" docs-stale --base HEAD^1 | grep -E '^(stale|missing) ' || true)
          {
            echo "## Docs freshness (warn-only)"
            echo
            if [ -n "$stale" ]; then
              echo "This PR changes code that these pages cite. Update them in this PR, or run \`/docs-review:docs-review --stale\`:"
              echo
              echo '```'; echo "$stale"; echo '```'
            else
              echo "No verified page cites code this PR changes."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$stale" ]; then
            while IFS= read -r l; do echo "::warning::$l"; done <<<"$stale"
          fi
