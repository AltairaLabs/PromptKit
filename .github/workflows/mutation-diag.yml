# TEMPORARY diagnostic workflow; removed before merge.
name: Mutation Diag
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        extra: [ "", "-gcflags=github.com/AltairaLabs/PromptKit/runtime/v2/pipeline/stage=-c=1" ]
    env:
      PROMPTKIT_SCHEMA_SOURCE: local
      DIAG_EXTRA_GOFLAGS: ${{ matrix.extra }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: scripts/ci-install-alsa.sh
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.0'
        cache: false
    - run: bash scripts/diag-mutation-cost.sh
