name: Deploy Documentation to GitHub Pages

on:
  release:
    types: [published]
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'sdk/examples/**/README.md'
      - 'scripts/prepare-examples-docs.sh'
      - 'scripts/rewrite-example-links.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Log deployment trigger
        env:
          REASON: ${{ inputs.reason }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "📝 Manual deployment triggered"
            if [ -n "$REASON" ]; then
              echo "Reason: $REASON"
            fi
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "🎉 Deploying documentation for release: $RELEASE_TAG"
          fi
      
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@32f57ac043e003bc1b07edcb2b9102bbbf3e92f1 # v6.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          cache: true

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Generate JSON schemas
        run: make schemas
      
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      
      - name: Install Node dependencies
        # Regenerate the lockfile on the CI platform first: a macOS-generated
        # lock omits the Linux rollup/esbuild native binaries (npm/cli#4828),
        # which `npm install` then honours, breaking the Astro build. Deleting
        # it forces a clean, platform-correct resolve. The committed lock stays
        # for local dev and the setup-node cache key.
        run: |
          rm -f docs/package-lock.json
          make docs-install
        env:
          # @altairalabs/brand (the masterbrand family bar) is a private
          # GitHub Packages dependency; docs/.npmrc reads this. secrets.GITHUB_TOKEN
          # cannot be used — it is scoped to this repo and cannot read another
          # repository's packages. Needs `read:packages`.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        
      - name: Build documentation
        run: make docs-build
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ github.token }}

      - name: Check for broken links
        working-directory: docs
        run: npm run check-links

      # check-links only crawls the built site and skips absolute
      # promptkit.altairalabs.ai URLs. This validates hardcoded production doc
      # URLs baked into scaffolding templates / package READMEs against dist/.
      - name: Check hardcoded doc URLs
        working-directory: docs
        run: npm run check-doc-urls

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
