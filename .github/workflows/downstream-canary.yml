name: Downstream Canary

# Builds and tests PromptKit's consumers against this PromptKit checkout
# instead of the last release: promptarena, the four promptarena deploy
# adapters, and Omnia. Without it a consumer meets a PromptKit change only
# after the tag is cut: promptarena#460 and #2525 both shipped in v2.18.0 that
# way.
#
# What each leg runs is scripts/downstream-canary.sh, so
# `scripts/downstream-canary.sh <consumer> <clone>` reproduces a red leg
# locally. The legs fail independently.
#
# Three callers:
#   - pull requests to main that change Go code or go.mod/go.sum (below). Not a
#     required check: a consumer's main can be red for reasons of its own, and
#     a PromptKit PR should not be blocked by that.
#   - release.yml, which calls it with workflow_call and refuses to tag on red
#     (bypass: the release's ignore_downstream_canary input).
#   - workflow_dispatch, to run it by hand against any promptarena ref.

on:
  pull_request:
    branches: [ main ]
    # Workflow-level paths, not a changes job: this check is not required, so
    # a PR it filters out has nothing waiting on it. If it is ever made
    # required, switch to a changes job (as promptarena's ci.yml does), or a
    # filtered-out PR will wait forever on a check that never starts.
    paths:
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/downstream-canary.yml'
      - 'scripts/downstream-canary.sh'
  workflow_call:
    inputs:
      promptarena-ref:
        description: 'promptarena branch, tag or SHA to test'
        required: false
        type: string
        default: main
      advisory:
        description: 'Report a red canary as a warning instead of failing'
        required: false
        type: boolean
        default: false
    secrets:
      DOWNSTREAM_DISPATCH_TOKEN:
        description: 'Reads the private consumers (omnia)'
        required: false
  workflow_dispatch:
    inputs:
      promptarena-ref:
        description: 'promptarena branch, tag or SHA to test'
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  canary:
    name: Downstream canary (${{ matrix.consumer }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - consumer: promptarena
            repository: AltairaLabs/promptarena
          - consumer: deploy-vertex
            repository: AltairaLabs/promptarena-deploy-vertex
          - consumer: deploy-omnia
            repository: AltairaLabs/PromptArena-deploy-omnia
          - consumer: deploy-agentcore
            repository: AltairaLabs/promptarena-deploy-agentcore
          - consumer: deploy-foundry
            repository: AltairaLabs/promptarena-deploy-foundry
          # Private: read with DOWNSTREAM_DISPATCH_TOKEN. Its build needs the
          # ALSA headers (ebitengine/oto), as its own CI installs them.
          - consumer: omnia
            repository: AltairaLabs/omnia
            private: true
            alsa: true
    # A newer push to the same PR supersedes the run; release runs never share
    # a group.
    concurrency:
      group: downstream-canary-${{ matrix.consumer }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    steps:
    - name: Checkout PromptKit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: promptkit

    # The public consumers need only the default token, so those legs work
    # from forks too. A fork or Dependabot PR gets no secrets, so its omnia
    # leg fails here. Advisory mode covers this step too, so a PAT that cannot
    # read omnia does not block a release run with ignore_downstream_canary.
    # The token is not left in .git/config: the consumer's tests run next.
    - name: Checkout ${{ matrix.repository }}
      id: checkout
      continue-on-error: ${{ inputs.advisory == true }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: ${{ matrix.repository }}
        ref: ${{ matrix.consumer == 'promptarena' && inputs.promptarena-ref || '' }}
        token: ${{ matrix.private && secrets.DOWNSTREAM_DISPATCH_TOKEN || github.token }}
        path: consumer

    - name: Install ALSA dev headers
      if: matrix.alsa && steps.checkout.outcome == 'success'
      timeout-minutes: 15
      run: promptkit/scripts/ci-install-alsa.sh

    # The consumer's own Go version: omnia is ahead of PromptKit's.
    - name: Set up Go
      if: steps.checkout.outcome == 'success'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: consumer/go.mod
        cache-dependency-path: |
          consumer/go.sum
          promptkit/runtime/go.sum
          promptkit/pkg/go.sum
          promptkit/sdk/go.sum
          promptkit/server/a2a/go.sum

    # Replaces the consumer's PromptKit requires with ./promptkit, then runs
    # its keyless build and tests. None of it needs an API key, a cluster or a
    # private npm package. Some omnia packages start Postgres with
    # testcontainers, which the runner's Docker provides.
    - name: Build and test ${{ matrix.consumer }} against this PromptKit
      id: canary
      if: steps.checkout.outcome == 'success'
      continue-on-error: ${{ inputs.advisory == true }}
      run: promptkit/scripts/downstream-canary.sh "${{ matrix.consumer }}" consumer promptkit

    - name: Report an advisory failure
      if: steps.checkout.outcome == 'failure' || steps.canary.outcome == 'failure'
      env:
        CONSUMER: ${{ matrix.consumer }}
      run: |
        echo "::warning::${CONSUMER} does not pass against this PromptKit; continuing because the canary was run as advisory"
        {
          echo "## Downstream canary failed for ${CONSUMER} (advisory)"
          echo ""
          echo "${CONSUMER} does not build or pass its keyless suite against this"
          echo "PromptKit. The run continued because the canary was bypassed."
        } >> "$GITHUB_STEP_SUMMARY"
