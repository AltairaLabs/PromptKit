# The two test-quality gates, required checks on main.
#
# They live outside ci.yml because ci.yml skips docs-only pull requests, and a
# required check that never reports leaves the PR waiting forever. This
# workflow runs on every pull request to main; when the PR changes no Go code
# each job passes after one cheap diff instead of building anything.
name: Test Gates

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  weak-assertions:
    # Job name must match the required status check context in the ruleset.
    name: Weak Assertion Guard
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The guard scans the merge base in a throwaway worktree and diffs it
        # against the working tree, so it needs real history — the default
        # shallow clone cannot check out the base commit at all.
        fetch-depth: 0

    - name: Detect Go changes
      id: scope
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        if git diff --name-only "$BASE" HEAD | grep -qE '\.go$|(^|/)go\.(mod|sum)$'; then
          echo "go=true" >> "$GITHUB_OUTPUT"
        else
          echo "No Go files changed; nothing for the guard to check."
          echo "go=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Go
      if: steps.scope.outputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.0'
        cache-dependency-path: tools/seamscan/go.sum

    # Fails only on NEW tests whose assertions cannot fail. The pre-existing
    # ones must not block unrelated work — see scripts/check-weak-assertions.sh
    # and .claude/skills/audit-test-seams/SKILL.md for the known limitations.
    #
    # The base SHA is passed explicitly rather than relying on the script's
    # origin/main default: on a pull_request event the checkout is a detached
    # merge commit, and depending on a remote-tracking ref existing is how this
    # kind of guard silently ends up diffing against the wrong tree.
    - name: Check for new tests that cannot fail (issue #1703)
      if: steps.scope.outputs.go == 'true'
      run: ./scripts/check-weak-assertions.sh "${{ github.event.pull_request.base.sha }}"

  # Each mutant recompiles its package with the package's tests and reruns
  # them, so a runner's 30 minutes hold a fixed number of mutants however many
  # workers it runs: ~250 runtime/pipeline/stage mutants (23 CPU-seconds each
  # on this 4-vCPU runner) before stage was split into stage/internal/<pkg>
  # packages, which cut a stage mutant's cost by about 60% and made a mutant
  # of an internal package cheaper still (see "Cost" in
  # scripts/check-mutation-diff.sh). A PR can still change many packages, so
  # the shards split the changed files between them (see "Sharding" in
  # scripts/check-mutation-diff.sh); the Mutation Gate job below
  # scores their mutants together.
  mutation-shard:
    name: Mutation Gate shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    env:
      PROMPTKIT_SCHEMA_SOURCE: local

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # gremlins diffs the working tree against the merge base.
        fetch-depth: 0

    - name: Detect Go changes
      id: scope
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
      run: |
        if git diff --name-only "$BASE" HEAD | grep -qE '\.go$|(^|/)go\.(mod|sum)$'; then
          echo "go=true" >> "$GITHUB_OUTPUT"
        else
          echo "No Go files changed; nothing to mutate."
          echo "go=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install ALSA dev headers (Linux)
      if: steps.scope.outputs.go == 'true'
      timeout-minutes: 15
      run: scripts/ci-install-alsa.sh

    - name: Set up Go
      if: steps.scope.outputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.0'

    - name: Install gremlins
      if: steps.scope.outputs.go == 'true'
      run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

    - name: Mutate this shard's changed lines
      env:
        MUTATION_SHARD: ${{ matrix.shard }}/4
        MUTATION_RESULTS: mutants-${{ matrix.shard }}.tsv
      run: |
        if [ "${{ steps.scope.outputs.go }}" = "true" ]; then
          ./scripts/check-mutation-diff.sh "${{ github.event.pull_request.base.sha }}"
        else
          : > "${MUTATION_RESULTS}"
        fi

    - name: Upload this shard's mutants
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mutants-${{ matrix.shard }}
        path: mutants-${{ matrix.shard }}.tsv
        if-no-files-found: error
        retention-days: 1

  mutation:
    # Job name must match the required status check context in the ruleset.
    name: Mutation Gate
    needs: mutation-shard
    # Runs when a shard fails too, so the required check reports a failure
    # instead of being skipped.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Require every shard to have finished
      if: needs.mutation-shard.result != 'success'
      run: |
        echo "FAIL: a mutation shard ended ${{ needs.mutation-shard.result }}; its log says why."
        exit 1

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download the shards' mutants
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: mutants-*
        path: mutants
        merge-multiple: true

    # The shards mutated the conditions and arithmetic on the lines this PR
    # changes in runtime/sdk/pkg/server-a2a and reran each changed package's
    # tests per mutant; this fails when fewer than 75% of all their mutants
    # were caught. See scripts/check-mutation-diff.sh for the scope and score.
    - name: Check that tests catch the changed lines
      run: ./scripts/check-mutation-diff.sh --score mutants/mutants-1.tsv mutants/mutants-2.tsv mutants/mutants-3.tsv mutants/mutants-4.tsv
