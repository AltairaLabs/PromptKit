name: PromptPack Schema Sync

# Keeps runtime/prompt/schema/promptpack.schema.json equal to the published
# PromptPack release by raising a PR when the spec publishes a new one.
#
# Two triggers, both wired:
#   - repository_dispatch from AltairaLabs/promptpack-spec's publish-schema.yml
#     when it tags a release (event_type=promptpack-release). Picks the release
#     up within minutes.
#   - the daily schedule, as the backstop for a missed or failed dispatch.
#
# Keep both. A dispatch is fire-and-forget: if the spec repo's step fails, is
# skipped, or the token lapses, nothing tells this repo it was missed — which is
# the same shape as the ::warning:: that let the schema drift 143 leaves for two
# and a half months. The schedule is what makes the sync self-healing.
#
# permissions: below governs GITHUB_TOKEN. The push and the PR use
# PERSONAL_ACCESS_TOKEN instead, for the reason on the "Open or update the sync
# PR" step.
#
# Deliberately opens a PR rather than pushing to main. Resyncing is NOT always
# mechanical: the 2026-08-30 resync (#1891) broke two spec-parity tests and
# needed a human decision about whether `Validator.message` and
# `Variable.binding` belong on the compiled structs. The bot does the fetch; a
# human resolves genuine spec-vs-runtime conflicts.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [promptpack-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Raise PR if the published schema has moved
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Check out with the PAT so the branch push below is attributed to it
        # rather than to GITHUB_TOKEN — see the note on "Open or update the sync
        # PR". Mirrors promptarena-deploy-foundry's update-deps.yml.
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.0'

    - name: Fetch the published schema
      run: ./scripts/fetch-promptpack-schema.sh

    - name: Detect change
      id: detect
      run: |
        EMBEDDED="runtime/prompt/schema/promptpack.schema.json"
        if git diff --quiet -- "$EMBEDDED"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "✓ Embedded PromptPack schema is already the published release"
        else
          VERSION=$(python3 -c "import json; print(json.load(open('$EMBEDDED'))['version'])")
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Published release is v$VERSION; embedded copy differs."
        fi

    # Regenerate the Go types and restate the spec version IN THE SAME commit.
    # The schema, the types generated from it and the version PromptKit claims
    # to implement are one fact spread over several files: landing the schema
    # alone leaves main failing packspec-check and spec-version-check until
    # someone notices. The version claims had gone five releases stale before
    # the check existed, so they are regenerated here rather than by hand.
    - name: Regenerate the pack types and restate the spec version
      if: steps.detect.outputs.changed == 'true'
      run: |
        make packspec
        ./scripts/check-spec-version.sh --write
        # sdk/doc.go states the version and feeds the generated SDK reference,
        # so the reference has to follow or the Reference Drift check fails on
        # the PR this workflow just opened.
        make docs-sdk-reference

    # Run the guards here as well as on the PR, so the PR body can say up front
    # whether this is a clean pickup or needs a decision.
    - name: Check spec-parity guards against the new schema
      if: steps.detect.outputs.changed == 'true'
      id: guards
      continue-on-error: true
      run: |
        set +e
        OUT=$(go -C runtime test ./prompt/... -count=1 -run 'MatchesPromptPackSpec' 2>&1)
        RUNTIME_RC=$?
        SDK_OUT=$(go -C sdk test ./internal/pack/... -count=1 2>&1)
        SDK_RC=$?
        OUT="${OUT}"$'\n'"${SDK_OUT}"
        {
          echo "output<<GUARDS_EOF"
          echo "$OUT" | grep -E '^(---|FAIL|ok)' | head -40
          echo "GUARDS_EOF"
        } >> "$GITHUB_OUTPUT"
        if [ $RUNTIME_RC -eq 0 ] && [ $SDK_RC -eq 0 ]; then
          echo "clean=true" >> "$GITHUB_OUTPUT"
        else
          echo "clean=false" >> "$GITHUB_OUTPUT"
        fi

    # The PAT is required, not a preference. GitHub deliberately does not start
    # workflow runs for events raised by GITHUB_TOKEN (a recursion guard), so a
    # PR opened with it never gets CI, its required checks never report, and it
    # sits mergeable-but-BLOCKED forever. It would also hide the spec-parity
    # failures this PR exists to surface.
    - name: Open or update the sync PR
      if: steps.detect.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        VERSION: ${{ steps.detect.outputs.version }}
        CLEAN: ${{ steps.guards.outputs.clean }}
        GUARDS: ${{ steps.guards.outputs.output }}
      run: |
        BRANCH="chore/promptpack-schema-v${VERSION}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -B "$BRANCH"
        git add runtime/prompt/schema/promptpack.schema.json runtime/packspec/types.go \
          README.md sdk/doc.go sdk/README.md docs/src/content/docs/sdk/reference/
        git commit -s -m "chore(schema): sync embedded PromptPack schema to v${VERSION}

        Fetched verbatim from the published release by
        scripts/fetch-promptpack-schema.sh. The embedded copy is a mirror and is
        never hand-edited; see runtime/prompt/schema/schema.go.

        Carries the regenerated packspec types, the restated spec version and the
        regenerated SDK reference in the same commit: they are one fact spread
        over several files, and landing the schema alone leaves main failing
        packspec-check and spec-version-check."
        git push -f origin "$BRANCH"

        if [ "$CLEAN" = "true" ]; then
          STATUS="**Clean pickup.** The spec-parity guards and pack schema tests pass against v${VERSION}."
        else
          STATUS="**Needs a decision.** A guard fails against v${VERSION} — the spec and the runtime disagree about a field.

        Resolve it by changing the Go type, or by recording a \`deliberateOmission\` in \`runtime/prompt/validator_spec_parity_test.go\` with the reason. **Do not edit the schema** — it is a verbatim mirror of the release."
        fi

        BODY="Automated sync: the published PromptPack schema is now **v${VERSION}**.

        ${STATUS}

        \`\`\`
        ${GUARDS}
        \`\`\`

        Raised by \`.github/workflows/promptpack-schema-sync.yml\`. **This PR is
        opened, never merged, by automation** — a human approves and merges it."

        if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
          gh pr edit "$BRANCH" --body "$BODY"
          echo "✓ Updated existing PR for $BRANCH"
        else
          gh pr create --head "$BRANCH" --base main \
            --title "chore(schema): sync embedded PromptPack schema to v${VERSION}" \
            --body "$BODY"
          # Requested separately so a reviewer problem cannot fail the create and
          # leave a branch pushed with no PR. Best-effort: CODEOWNERS already
          # covers /runtime/, this just makes the request explicit on the PR.
          gh pr edit "$BRANCH" --add-reviewer AltairaLabs/maintainers || \
            echo "::warning::could not request a review from AltairaLabs/maintainers"
          echo "✓ Opened PR for $BRANCH"
        fi
