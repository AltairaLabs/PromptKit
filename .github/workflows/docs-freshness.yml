name: Docs Freshness

# Weekly report of docs pages whose verified sources changed, and of public
# surface no page covers, kept in one open issue labelled docs-freshness.
# A person runs `/docs-review --stale` against it. Never blocks anything.
on:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Docs freshness report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build report
        run: |
          bash scripts/docs-stale.sh > "$RUNNER_TEMP/stale.txt"
          bash scripts/docs-coverage.sh > "$RUNNER_TEMP/uncovered.txt"
          body="$RUNNER_TEMP/body.md"
          {
            echo "Generated by \`docs-freshness.yml\`. Run \`/docs-review --stale\` to fix what is listed; this issue updates weekly."
            echo
            echo "## Stale pages (verified sources changed)"
            echo
            echo '```'
            grep -E '^(stale|missing|unknown-commit) ' "$RUNNER_TEMP/stale.txt" || echo "none"
            echo '```'
            echo
            echo "## Public surface with no page"
            echo
            echo '```'
            cat "$RUNNER_TEMP/uncovered.txt"; [ -s "$RUNNER_TEMP/uncovered.txt" ] || echo "none"
            echo '```'
            echo
            echo "Pages with no verification record yet: $(grep -c '^unverified ' "$RUNNER_TEMP/stale.txt" || true)"
          } > "$body"

      - name: Create or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create docs-freshness --color C5DEF5 --description "Weekly docs freshness report" --force
          n=$(gh issue list --label docs-freshness --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "Docs freshness report" --label docs-freshness --body-file "$RUNNER_TEMP/body.md"
          fi
