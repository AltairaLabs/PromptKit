name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string
      phase:
        description: 'Release phase'
        required: true
        type: choice
        options:
          - full
          - libs-only
          - tools-only
        default: full
      skip_tests:
        description: 'Skip running tests'
        required: false
        type: boolean
        default: false
      ignore_previous_release_check:
        description: "Release even if the PREVIOUS release's published go.mod is bad (use when this release is the roll-forward fix)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Install ALSA dev headers (Linux)
      if: runner.os == 'Linux' && inputs.skip_tests != true
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - name: Validate version format
      id: validate
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        VERSION="$INPUT_VERSION"
        
        # Ensure version starts with 'v'
        if [[ ! $VERSION =~ ^v ]]; then
          VERSION="v$VERSION"
        fi
        
        # Validate semver format
        if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Version must be in format v1.0.0"
          exit 1
        fi
        
        # Check if version already exists (allow re-running tools-only releases)
        if git tag -l | grep -q "^$VERSION$\|^runtime/$VERSION$"; then
          if [ "${{ inputs.phase }}" = "tools-only" ]; then
            echo "⚠ Version $VERSION already exists, but proceeding with tools-only release"
          else
            echo "::error::Version $VERSION already exists"
            exit 1
          fi
        fi

        # tools-only re-runs finish tagging the SDK/server modules for a version
        # whose libraries (runtime/pkg/root) are already tagged. The
        # newer-than-latest ordering check below would always fail for that case
        # (LATEST == the version being completed), so skip it for tools-only.
        if [ "${{ inputs.phase }}" = "tools-only" ]; then
          echo "✓ tools-only phase: skipping newer-than-latest ordering check"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✓ Version $VERSION is valid for a tools-only release"
          exit 0
        fi

        # Get latest version and compare
        echo "Checking if $VERSION is newer than existing versions..."
        LATEST_TAG=$(git tag -l "runtime/v*" | sort -V | tail -n1)
        
        if [ -n "$LATEST_TAG" ]; then
          LATEST_VERSION="${LATEST_TAG#runtime/}"
          echo "Latest existing version: $LATEST_VERSION"
          echo "New version: $VERSION"
          
          # Extract version numbers for comparison
          LATEST_MAJOR=$(echo "$LATEST_VERSION" | cut -d. -f1 | sed 's/v//')
          LATEST_MINOR=$(echo "$LATEST_VERSION" | cut -d. -f2)
          LATEST_PATCH=$(echo "$LATEST_VERSION" | cut -d. -f3)
          
          NEW_MAJOR=$(echo "$VERSION" | cut -d. -f1 | sed 's/v//')
          NEW_MINOR=$(echo "$VERSION" | cut -d. -f2)
          NEW_PATCH=$(echo "$VERSION" | cut -d. -f3)
          
          # Compare versions
          if [ "$NEW_MAJOR" -lt "$LATEST_MAJOR" ]; then
            echo "::error::New version $VERSION is older than latest $LATEST_VERSION (major version is lower)"
            exit 1
          elif [ "$NEW_MAJOR" -eq "$LATEST_MAJOR" ] && [ "$NEW_MINOR" -lt "$LATEST_MINOR" ]; then
            echo "::error::New version $VERSION is older than latest $LATEST_VERSION (minor version is lower)"
            exit 1
          elif [ "$NEW_MAJOR" -eq "$LATEST_MAJOR" ] && [ "$NEW_MINOR" -eq "$LATEST_MINOR" ] && [ "$NEW_PATCH" -le "$LATEST_PATCH" ]; then
            echo "::error::New version $VERSION is not newer than latest $LATEST_VERSION (patch version is not higher)"
            exit 1
          fi
          
          echo "✓ Version $VERSION is newer than $LATEST_VERSION"
        else
          echo "✓ No existing versions found, this will be the first release"
        fi
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "✓ Version $VERSION is valid and available"
    
    # The post-tag check at the end of each release can only see modules the Go
    # proxy has already picked up. Measured on v1.5.8: runtime and pkg were
    # served ~3s after tagging, sdk and server/a2a were still 404 half an hour
    # later — so that check reliably verifies half the modules and skips the
    # other half. Checking the PREVIOUS release here closes the gap: by now the
    # proxy has had days, so all four are actually verified. A bad release is
    # caught one release late rather than never.
    #
    # Blocking by default, because the usual cause of a bad published go.mod is
    # a broken release script — and running it again would just publish a second
    # bad release. When THIS release is the roll-forward fix, re-run with
    # ignore_previous_release_check=true. (The old tag can never be repaired;
    # rolling forward is the only remedy.)
    - name: Verify the previous release's published go.mod
      env:
        VERSION: ${{ steps.validate.outputs.version }}
        IGNORE: ${{ inputs.ignore_previous_release_check }}
      run: |
        # Highest runtime/vX.Y.Z tag strictly BELOW the version being released.
        # Splice VERSION into the sorted list and take the line before it —
        # simply excluding VERSION and taking the max is wrong for a tools-only
        # re-run of an older version, which would then select a LATER release as
        # its "previous".
        PREV=$( { git tag -l 'runtime/v*' | sed 's|^runtime/||'; echo "$VERSION"; } \
          | sort -V -u \
          | grep -B1 -Fx "$VERSION" \
          | head -n1)

        # VERSION sorted first, so there is nothing below it.
        if [ -z "$PREV" ] || [ "$PREV" = "$VERSION" ]; then
          echo "No previous release below $VERSION — nothing to verify."
          exit 0
        fi

        echo "Verifying the previously published release $PREV..."
        if ./scripts/verify-published-gomod.sh "$PREV" runtime pkg sdk server/a2a; then
          echo "✓ $PREV is release-clean" >> $GITHUB_STEP_SUMMARY
          exit 0
        fi

        {
          echo "## ⚠ The previous release ($PREV) has a bad go.mod"
          echo ""
          echo "One or more published modules at \`$PREV\` carry an internal"
          echo "\`replace\`, or an internal \`require\` pointing at the wrong version."
          echo "See the job log for the offending lines."
          echo ""
          echo "\`$PREV\` cannot be repaired — published tags are immutable."
          echo "If **this** release is the roll-forward fix, re-run it with"
          echo "\`ignore_previous_release_check=true\`."
        } >> $GITHUB_STEP_SUMMARY

        if [ "$IGNORE" = "true" ]; then
          echo "::warning::Previous release $PREV has a bad go.mod; continuing because ignore_previous_release_check=true"
          exit 0
        fi

        echo "::error::Previous release $PREV published a bad go.mod — releasing again may repeat it. Re-run with ignore_previous_release_check=true if this release is the fix."
        exit 1

    - name: Setup Go
      if: ${{ !inputs.skip_tests }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.0'
        cache: false  # Disable cache since we use a workspace setup
    
    - name: Install dependencies
      if: ${{ !inputs.skip_tests }}
      run: make install
    
    - name: Generate schemas for tests
      if: ${{ !inputs.skip_tests }}
      run: make schemas-copy
    
    - name: Run tests
      if: ${{ !inputs.skip_tests }}
      run: |
        echo "Running full test suite..."
        make test
        make test-race
        echo "✓ All tests passed"

    # The three gates below exist because v1.8.0 shipped past all of them and
    # Omnia filed the tickets. `make test` above runs inside the Go workspace,
    # which unifies the four modules into one build list — so it is structurally
    # incapable of seeing either problem.

    # #1920: runtime required apimachinery v0.36.4 against sdk's v0.37.0. MVS
    # hands a consumer taking both the higher one, and the build dies inside
    # k8s.io/api.
    - name: Check the modules agree on shared dependency versions
      run: make module-dep-skew-check

    # The shape the workspace hides: each module resolved on its own, the way a
    # consumer gets it.
    - name: Build every module outside the workspace
      run: make modules-standalone-check

    # #1921: v1.8.0 removed nine exported symbols and shipped as a MINOR, so the
    # released PromptArena could not build against it. gorelease exits non-zero
    # when the claimed version cannot carry the API changes found.
    #
    # This is a hard gate on purpose. A breaking change in a minor is a bug, not
    # a policy — if the API must break, that is a major, and the Go module-path
    # change it forces is the friction that stops it happening by accident.
    - name: Check the API changes fit the version
      run: ./scripts/check-api-compatibility.sh "${{ inputs.version }}"

  tag-dependencies:
    name: Tag Libraries
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.phase == 'full' || inputs.phase == 'libs-only' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.0'
        cache: false  # Disable cache since we use a workspace setup

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Fetch remote tags
      # See update-tools/Fetch remote tags for rationale.
      run: git fetch --tags --force origin

    # Fail before anything is pushed if runtime has grown a dependency on a
    # sibling module: the tag below is cut straight from this tree, so a stale
    # internal require would ship immutably (issue #1713).
    - name: Check runtime is still a leaf module
      run: ./scripts/check-runtime-is-leaf.sh

    # Root and runtime are tagged from the default branch, before the release
    # branch exists. The root tag is what the GitHub release — and therefore
    # the docs/schema deployment — hangs off, so it must point at a commit on
    # main; runtime has no internal requires to rewrite. Only pkg needs the
    # release-branch treatment sdk and server/a2a get.
    - name: Tag root version (for GoReleaser)
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "Tagging $VERSION (root-level for GoReleaser/releases)"
        if git rev-parse "$VERSION" >/dev/null 2>&1; then
          echo "⚠ Tag $VERSION already exists, skipping"
        else
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "✓ Tagged $VERSION"
        fi

    - name: Tag runtime
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "Tagging runtime/$VERSION"
        if git rev-parse "runtime/$VERSION" >/dev/null 2>&1; then
          echo "⚠ Tag runtime/$VERSION already exists, skipping"
        else
          git tag -a "runtime/$VERSION" -m "Release runtime $VERSION"
          git push origin "runtime/$VERSION"
          echo "✓ Tagged runtime/$VERSION"
        fi

    - name: Create release branch
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        BRANCH="release/libs/$VERSION"
        # Check if branch already exists remotely
        if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
          echo "⚠ Branch $BRANCH already exists, checking it out"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
        else
          git checkout -b "$BRANCH"
          echo "✓ Created branch $BRANCH"
        fi

    # No `go mod tidy`: a dependency module's go.sum is never consulted, since
    # Go verifies downloads against the *main* module's go.sum. Tidying here
    # would need runtime/$VERSION to be proxy-visible first; `go mod edit` is
    # pure text and does not, which is what keeps this a single step.
    - name: Update pkg dependencies
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "Updating pkg to use $VERSION..."
        cd pkg

        go mod edit -require="github.com/AltairaLabs/PromptKit/runtime/v2@$VERSION"

        # pkg keeps `replace .../runtime => ../runtime` on main so workspace and
        # GOWORK=off builds resolve the local tree. It must not ship in the tag:
        # Go ignores replace in a dependency module but honors require, so the
        # replace masked a stale `require runtime v1.3.5` for five releases
        # (issue #1713).
        go mod edit -dropreplace=github.com/AltairaLabs/PromptKit/runtime/v2

        if grep -q '^replace' go.mod; then
          echo "::error::pkg/go.mod still has replace directives after cleanup:"
          grep '^replace' go.mod
          exit 1
        fi

        cd ..
        echo "✓ Updated pkg go.mod to $VERSION"

    - name: Commit changes
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        BRANCH="release/libs/$VERSION"

        # Check if there are changes to commit
        if git diff --quiet pkg/go.mod; then
          echo "⚠ No changes to commit (already up to date)"
        else
          git add pkg/go.mod
          git commit -m "release: update pkg to $VERSION"
          git push origin "$BRANCH"
          echo "✓ Pushed $BRANCH"
        fi

    - name: Tag pkg
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "Tagging pkg/$VERSION from release branch (replace dropped, require bumped)"
        if git rev-parse "pkg/$VERSION" >/dev/null 2>&1; then
          echo "⚠ Tag pkg/$VERSION already exists, skipping"
        else
          git tag -a "pkg/$VERSION" -m "Release pkg $VERSION"
          git push origin "pkg/$VERSION"
          echo "✓ Tagged pkg/$VERSION"
        fi

    # Correctness gate, not an availability gate: it fetches each published
    # go.mod from the Go proxy and fails the release if a tag carries an
    # internal replace or an internal require pointing anywhere but $VERSION.
    # Propagation timeouts are reported as warnings and do not fail, which is
    # what the availability check this replaces was really doing.
    - name: Verify published go.mod on Go proxy
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: ./scripts/verify-published-gomod.sh "$VERSION" runtime pkg

  update-tools:
    name: Update and Tag SDK Modules
    runs-on: ubuntu-latest
    needs: [validate, tag-dependencies]
    # `always()` is needed because tag-dependencies is *skipped* on a tools-only
    # re-run, and a skipped dependency would otherwise skip this job too. But it
    # must not mean "run even when the libs phase failed": on a full release,
    # tagging sdk on top of libraries that failed to tag or published a bad
    # go.mod just adds more immutable tags to clean up.
    if: >-
      ${{ always() && needs.validate.result == 'success' && (
        inputs.phase == 'tools-only' ||
        (inputs.phase == 'full' && needs.tag-dependencies.result == 'success')
      ) }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Install ALSA dev headers (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.0'
        cache: false  # Disable cache since we use a workspace setup

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Fetch remote tags
      # Ensure local tag state reflects the remote. Without this, the per-tag
      # `git rev-parse "<tag>" >/dev/null 2>&1` checks miss tags that exist on
      # remote but weren't pulled into the local clone — which causes the
      # workflow to try to create+push tags that already exist remotely and
      # fail with "remote rejected" / "remote: fatal error in commit_refs".
      run: git fetch --tags --force origin

    - name: Create release branch
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        BRANCH="release/tools/$VERSION"
        # Check if branch already exists remotely
        if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
          echo "⚠ Branch $BRANCH already exists, checking it out"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
        else
          git checkout -b "$BRANCH"
          echo "✓ Created branch $BRANCH"
        fi
    
    - name: Update server/a2a dependencies
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "Updating server/a2a to use $VERSION..."
        cd server/a2a

        # Update go.mod to require new versions
        echo "Setting required versions to $VERSION..."
        go mod edit -require="github.com/AltairaLabs/PromptKit/runtime/v2@$VERSION"

        # Remove local replace directives
        go mod edit -dropreplace=github.com/AltairaLabs/PromptKit/runtime/v2

        # Same guard as the sdk step below.
        if grep -q '^replace' go.mod; then
          echo "::error::server/a2a/go.mod still has replace directives after cleanup:"
          grep '^replace' go.mod
          exit 1
        fi

        cd ../..
        echo "✓ Updated server/a2a go.mod to $VERSION"

    - name: Update sdk dependencies
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "Updating sdk to use $VERSION..."
        cd sdk

        # Update go.mod to require new versions
        echo "Setting required versions to $VERSION..."
        go mod edit -require="github.com/AltairaLabs/PromptKit/runtime/v2@$VERSION"
        go mod edit -require="github.com/AltairaLabs/PromptKit/pkg/v2@$VERSION"
        go mod edit -require="github.com/AltairaLabs/PromptKit/server/a2a/v2@$VERSION"

        # Remove local replace directives. All three must go: sdk replaces
        # runtime, server/a2a AND pkg locally, and a published module carrying a
        # relative-path replace is at best confusing to read. pkg was missing
        # here through v1.5.7, so every sdk tag up to that point shipped
        # `replace github.com/AltairaLabs/PromptKit/pkg/v2 => ../pkg`.
        go mod edit -dropreplace=github.com/AltairaLabs/PromptKit/runtime/v2
        go mod edit -dropreplace=github.com/AltairaLabs/PromptKit/server/a2a/v2
        go mod edit -dropreplace=github.com/AltairaLabs/PromptKit/pkg/v2

        # Fail loudly rather than shipping another tag with a dangling relative
        # path: this is exactly the class of defect that stayed invisible for
        # five releases, because Go ignores replace in a dependency module so
        # nothing downstream ever complained.
        if grep -q '^replace' go.mod; then
          echo "::error::sdk/go.mod still has replace directives after cleanup:"
          grep '^replace' go.mod
          exit 1
        fi

        cd ..
        echo "✓ Updated sdk go.mod to $VERSION"

    - name: Commit changes
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        BRANCH="release/tools/$VERSION"

        # Check if there are changes to commit
        if git diff --quiet server/a2a/go.mod server/a2a/go.sum sdk/go.mod sdk/go.sum; then
          echo "⚠ No changes to commit (already up to date)"
        else
          git add server/a2a/go.mod server/a2a/go.sum
          git add sdk/go.mod sdk/go.sum
          git commit -m "release: update modules to $VERSION"
          git push origin "$BRANCH"
          echo "✓ Pushed $BRANCH"
        fi
    
    - name: Tag server/a2a
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "Tagging server/a2a/$VERSION from release branch (replace directives removed)"
        if git rev-parse "server/a2a/$VERSION" >/dev/null 2>&1; then
          echo "⚠ Tag server/a2a/$VERSION already exists, skipping"
        else
          git tag -a "server/a2a/$VERSION" -m "Release server/a2a $VERSION"
          git push origin "server/a2a/$VERSION"
          echo "✓ Tagged server/a2a/$VERSION"
        fi

    - name: Tag sdk
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: |
        echo "Tagging sdk/$VERSION from release branch (replace directives removed)"
        if git rev-parse "sdk/$VERSION" >/dev/null 2>&1; then
          echo "⚠ Tag sdk/$VERSION already exists, skipping"
        else
          git tag -a "sdk/$VERSION" -m "Release sdk $VERSION"
          git push origin "sdk/$VERSION"
          echo "✓ Tagged sdk/$VERSION"
        fi

    # Deliberately NOT continue-on-error, unlike the availability check this
    # replaces: a published tag with an internal replace or a stale internal
    # require is a real defect that reaches consumers, and tags are immutable,
    # so it must stop the release loudly rather than warn into a log nobody
    # reads. Propagation timeouts still pass — see the script header.
    - name: Verify published go.mod on Go proxy
      env:
        VERSION: ${{ needs.validate.outputs.version }}
      run: ./scripts/verify-published-gomod.sh "$VERSION" sdk server/a2a

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, tag-dependencies]
    if: ${{ inputs.phase == 'full' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # PromptKit ships Go library modules only (runtime/pkg/sdk/server-a2a),
    # consumed via `go get` from the tags created above — there are no binaries
    # to build. Create a draft GitHub release with auto-generated notes; the
    # verify-docs job publishes it with a PAT to trigger schema/docs deployment.
    - name: Create draft GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.validate.outputs.version }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        echo "Creating draft release $VERSION (libraries only — no binaries)..."
        if gh release view "$VERSION" --repo "$GITHUB_REPO" >/dev/null 2>&1; then
          echo "⚠ Release $VERSION already exists, skipping create"
        else
          gh release create "$VERSION" \
            --repo "$GITHUB_REPO" \
            --title "PromptKit $VERSION" \
            --generate-notes \
            --draft
          echo "✓ Draft release $VERSION created"
        fi

    - name: Release summary
      run: |
        echo "## 📦 Draft Release Created" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "PromptKit ships Go library modules (no binaries)." >> $GITHUB_STEP_SUMMARY
        echo "A draft GitHub release with auto-generated notes was created for ${{ needs.validate.outputs.version }}." >> $GITHUB_STEP_SUMMARY
        echo "The verify-docs job publishes it to trigger schema/docs deployment." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Review at:** https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY

  verify-docs:
    name: Verify Docs Deployment
    runs-on: ubuntu-latest
    needs: [validate, create-release]
    if: ${{ inputs.phase == 'full' && needs.create-release.result == 'success' }}

    steps:
    - name: Publish draft release
      env:
        GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        VERSION: ${{ needs.validate.outputs.version }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        echo "Publishing draft release $VERSION..."
        gh release edit "$VERSION" --repo "$GITHUB_REPO" --draft=false
        echo "✓ Release $VERSION published"

    - name: Wait for docs deployment
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        echo "Waiting for docs deployment to start..."
        sleep 30

        # Find the docs workflow run triggered by this release
        for i in {1..10}; do
          RUN_ID=$(gh run list --repo "$GITHUB_REPO" --workflow docs.yml --limit 1 --json databaseId,event,status --jq '.[0] | select(.event == "release") | .databaseId')
          if [ -n "$RUN_ID" ]; then
            echo "Found docs workflow run: $RUN_ID"
            break
          fi
          echo "Attempt $i/10: Docs workflow not started yet, waiting 15s..."
          sleep 15
        done

        if [ -z "$RUN_ID" ]; then
          echo "::error::Docs workflow did not start after release publish"
          exit 1
        fi

        echo "Watching docs workflow run $RUN_ID..."
        if gh run watch "$RUN_ID" --repo "$GITHUB_REPO" --exit-status; then
          echo "✓ Docs deployed successfully"
        else
          echo "::error::Docs deployment failed — schemas may not be published"
          echo "Re-run the docs workflow manually: gh workflow run docs.yml"
          exit 1
        fi

  notify-downstream:
    name: Notify Downstream Repos
    runs-on: ubuntu-latest
    needs: [validate, tag-dependencies]
    if: ${{ needs.tag-dependencies.result == 'success' }}

    steps:
    - name: Dispatch to promptarena-deploy-agentcore
      continue-on-error: true
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
      run: |
        echo "Notifying promptarena-deploy-agentcore of runtime/$VERSION..."
        gh api repos/AltairaLabs/promptarena-deploy-agentcore/dispatches \
          -f event_type=promptkit-release \
          -f "client_payload[version]=$VERSION"
        echo "✓ Dispatched to promptarena-deploy-agentcore"

    - name: Dispatch to promptarena-deploy-omnia
      continue-on-error: true
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
      run: |
        echo "Notifying promptarena-deploy-omnia of runtime/$VERSION..."
        gh api repos/AltairaLabs/PromptArena-deploy-omnia/dispatches \
          -f event_type=promptkit-release \
          -f "client_payload[version]=$VERSION"
        echo "✓ Dispatched to promptarena-deploy-omnia"

    # vertex and foundry depend on PromptKit exactly as the two above do, but
    # were never added here, so they have been missing every release since they
    # were written. Their bumps were raised by hand or not at all.
    - name: Dispatch to promptarena-deploy-vertex
      continue-on-error: true
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
      run: |
        echo "Notifying promptarena-deploy-vertex of runtime/$VERSION..."
        gh api repos/AltairaLabs/promptarena-deploy-vertex/dispatches \
          -f event_type=promptkit-release \
          -f "client_payload[version]=$VERSION"
        echo "✓ Dispatched to promptarena-deploy-vertex"

    - name: Dispatch to promptarena-deploy-foundry
      continue-on-error: true
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
      run: |
        echo "Notifying promptarena-deploy-foundry of runtime/$VERSION..."
        gh api repos/AltairaLabs/promptarena-deploy-foundry/dispatches \
          -f event_type=promptkit-release \
          -f "client_payload[version]=$VERSION"
        echo "✓ Dispatched to promptarena-deploy-foundry"

  summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [validate, tag-dependencies, update-tools, create-release, verify-docs, notify-downstream]
    if: always()
    
    steps:
    - name: Generate summary
      env:
        VERSION: ${{ needs.validate.outputs.version }}
        VALIDATION_RESULT: ${{ needs.validate.result }}
        DEPENDENCIES_RESULT: ${{ needs.tag-dependencies.result }}
        TOOLS_RESULT: ${{ needs.update-tools.result }}
        RELEASE_RESULT: ${{ needs.create-release.result }}
        DOCS_RESULT: ${{ needs.verify-docs.result }}
        DOWNSTREAM_RESULT: ${{ needs.notify-downstream.result }}
        GITHUB_REPO: ${{ github.repository }}
      run: |
        cat >> $GITHUB_STEP_SUMMARY << EOF
        # Release $VERSION Summary

        ## Status

        - Validation: $VALIDATION_RESULT
        - Dependencies: $DEPENDENCIES_RESULT
        - SDK Modules: $TOOLS_RESULT
        - GitHub Release: $RELEASE_RESULT
        - Docs Deployment: $DOCS_RESULT
        - Downstream Notification: $DOWNSTREAM_RESULT

        ## Installation

        PromptKit ships Go library modules only. The PromptArena and PackC CLIs
        now live in [github.com/AltairaLabs/promptarena](https://github.com/AltairaLabs/promptarena).

        **SDK Library:**
        \`\`\`bash
        go get github.com/AltairaLabs/PromptKit/sdk/v2@$VERSION
        go get github.com/AltairaLabs/PromptKit/runtime/v2@$VERSION
        \`\`\`

        ## Next Steps

        1. Verify the [published release](https://github.com/$GITHUB_REPO/releases)
        2. Announce the release
        EOF
